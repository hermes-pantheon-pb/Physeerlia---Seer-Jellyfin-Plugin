name: Build and Package Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Plugin & Web Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Bundle
        working-directory: web
        run: npm run build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET Dependencies
        run: dotnet restore src/Jellyfin.Plugin.Seer/Jellyfin.Plugin.Seer.csproj

      - name: Build .NET Plugin
        run: dotnet build src/Jellyfin.Plugin.Seer/Jellyfin.Plugin.Seer.csproj -c Release --no-restore

      - name: Package Plugin Artifacts & Compute Checksum
        run: |
          mkdir -p dist/package
          cp src/Jellyfin.Plugin.Seer/bin/Release/net8.0/Jellyfin.Plugin.Seer.dll dist/package/
          cp meta.json dist/package/
          cd dist/package
          zip -r ../../jellyfin-plugin-seer.zip .
          cd ../..
          CHECKSUM=$(md5sum jellyfin-plugin-seer.zip | awk '{ print $1 }')
          echo "Computed package checksum: $CHECKSUM"
          sed -i 's/"checksum": "[^"]*"/"checksum": "'"$CHECKSUM"'"/' manifest.json

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-seer
          path: jellyfin-plugin-seer.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jellyfin-plugin-seer.zip
            manifest.json

      - name: Sync Manifest Checksum to Repository
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize release checksum in manifest.json [skip ci]"
            git push origin HEAD:main
          fi
